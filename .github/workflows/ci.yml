name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-targets

  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Runs the full snapshot suite (594 textual snapshots across 11 writers,
      # plus unit/validation tests).
      - name: Test
        run: cargo test

      # On failure, surface any pending snapshot diffs so they can be reviewed
      # (locally: `cargo insta review`) or regenerated (`INSTA_UPDATE=always cargo test`).
      - name: Note pending snapshots
        if: failure()
        shell: bash
        run: |
          echo "### Snapshot test failure on ${{ matrix.os }}" >> "$GITHUB_STEP_SUMMARY"
          pending=$(find . -name '*.snap.new' | wc -l | tr -d ' ')
          echo "Pending snapshot files: **$pending**" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Review with \`cargo insta review\`, or accept intended changes with \`INSTA_UPDATE=always cargo test\`." >> "$GITHUB_STEP_SUMMARY"
      - name: Upload pending snapshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pending-snapshots-${{ matrix.os }}
          path: "**/*.snap.new"
          if-no-files-found: ignore
          retention-days: 14

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -- -D warnings

  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check
