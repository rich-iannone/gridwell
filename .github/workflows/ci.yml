name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check
      - name: R glue crate
        run: cargo fmt --manifest-path r-package/src/rust/Cargo.toml -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # --all-targets: tests, benches and examples are code too.
      - run: cargo clippy --all-targets --locked -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      # Tests that need external tools skip when the tool is missing. In CI a skip
      # would hide a regression, so require the tools wherever they are installed.
      # (The C API test is Unix-only for now.)
      GRIDWELL_REQUIRE_C_TOOLCHAIN: ${{ matrix.os != 'windows-latest' && '1' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Typst + pdftotext for the Typst compile/verbatim oracle. Same Typst version
      # as the pinned harness image (harness/Dockerfile).
      - name: Install Typst (Linux)
        if: matrix.os == 'ubuntu-latest'
        uses: typst-community/setup-typst@v5
        with:
          typst-version: "0.12.0"
      - name: Install Poppler (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q poppler-utils
          echo "GRIDWELL_REQUIRE_TYPST=1" >> "$GITHUB_ENV"

      # Unit/validation tests, 594 writer snapshots, span stress, CLI end-to-end,
      # FFI (Rust-side, generated-header drift, C/C++/ASan smoke), Typst oracle.
      - name: Test
        run: cargo test --locked

      # On failure, surface any pending snapshot diffs so they can be reviewed
      # (locally: `cargo insta review`) or regenerated (`INSTA_UPDATE=always cargo test`).
      - name: Note pending snapshots
        if: failure()
        shell: bash
        run: |
          echo "### Snapshot test failure on ${{ matrix.os }}" >> "$GITHUB_STEP_SUMMARY"
          pending=$(find . -name '*.snap.new' | wc -l | tr -d ' ')
          echo "Pending snapshot files: **$pending**" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Review with \`cargo insta review\`, or accept intended changes with \`INSTA_UPDATE=always cargo test\`." >> "$GITHUB_STEP_SUMMARY"
      - name: Upload pending snapshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pending-snapshots-${{ matrix.os }}
          path: "**/*.snap.new"
          if-no-files-found: ignore
          retention-days: 14

  msrv:
    name: MSRV (Rust 1.85)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Keep in sync with `workspace.package.rust-version` in Cargo.toml.
      - uses: dtolnay/rust-toolchain@1.85
      - uses: Swatinem/rust-cache@v2
      # xtask is a dev tool with heavier deps (image needs a newer Rust) and is not
      # shipped; the Python crate is checked in the python job.
      - run: cargo check --locked --workspace --exclude xtask --exclude gridwell-python --all-targets

  python-wheel:
    name: Python wheel (abi3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Clippy (gridwell-python)
        run: cargo clippy -p gridwell-python --all-targets --locked -- -D warnings
      - name: Build wheel
        run: |
          python -m pip install --upgrade pip maturin
          maturin build --release --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: python-wheel
          path: dist/*.whl
          retention-days: 7

  python-test:
    name: Python ${{ matrix.python }} (${{ matrix.variant }})
    needs: python-wheel
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        # core: bare `pip install gridwell` (no pandas / great_tables)
        # gt:   `pip install 'gridwell[gt]'`
        variant: [core, gt]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: python-wheel
          path: dist
      - name: Install wheel
        shell: bash
        run: |
          python -m pip install --upgrade pip
          whl=$(ls dist/*.whl)
          if [ "${{ matrix.variant }}" = gt ]; then
            python -m pip install "gridwell[gt] @ file://$PWD/$whl" pytest
          else
            python -m pip install "$whl" pytest
            # The core variant must really lack the optional dependencies.
            python -c "import importlib.util as u, sys; sys.exit(any(u.find_spec(m) for m in ('pandas', 'great_tables')))"
          fi
      # Run from outside the checkout so `import gridwell` resolves to the installed
      # wheel, not the python/ source tree.
      - name: Test installed wheel
        working-directory: ${{ runner.temp }}
        run: python -m pytest -p no:cacheprovider -rs "$GITHUB_WORKSPACE/tests"

  r:
    name: R package (install + testthat)
    runs-on: ubuntu-latest
    # Full `R CMD check` needs a self-contained package (vendored crates instead of
    # path deps into ../../../crates); that is roadmap item M6. Until then this
    # builds and installs the package and runs its testthat suite.
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: r-package/src/rust
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: r-package
          extra-packages: any::testthat, any::jsonlite
      - name: Clippy (R glue crate)
        run: cargo clippy --manifest-path r-package/src/rust/Cargo.toml --locked -- -D warnings
      - name: Install package
        run: R CMD INSTALL r-package
      - name: testthat
        run: |
          Rscript -e 'testthat::test_dir("r-package/tests/testthat", package = "gridwell",
                                         load_package = "installed", stop_on_failure = TRUE)'

  fuzz:
    name: Fuzz smoke (60s/target)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            fuzz
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      # Random bytes rarely form valid IR JSON; seed every target with the fixture
      # corpus and the full example corpus so the fuzzer starts from real tables.
      - name: Seed corpus
        run: |
          cargo xtask corpus
          for t in fuzz_parse_ir fuzz_validate fuzz_render_html; do
            mkdir -p "fuzz/corpus/$t"
            cp fixtures/*/*.json harness/corpus/*.json "fuzz/corpus/$t/"
          done
      - name: Fuzz
        run: |
          for t in fuzz_parse_ir fuzz_validate fuzz_render_html; do
            echo "::group::$t"
            cargo fuzz run "$t" -- -max_total_time=60 -rss_limit_mb=2048 -max_len=65536
            echo "::endgroup::"
          done
      - name: Upload crashes
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
          retention-days: 30
