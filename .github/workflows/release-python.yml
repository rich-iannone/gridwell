name: Release (Python)

# Publishes gridwell to PyPI on a version tag (`py-v0.1.0`, matching the version in
# Cargo.toml, pyproject.toml and python/gridwell/__init__.py), once the wheels and
# the sdist have been built, tested and checked (`wheels.yml`). To try all of that
# without publishing, run `dry-run-python.yml` first.
#
# Once PyPI has the release, publish a GitHub Release on the tag with its notes
# (`gh release create py-v0.1.0 --title "gridwell 0.1.0 (Python)" --notes-file
# notes.md`). The Releases are the changelog (the package's Changelog link).
#
# Publishing uses a PyPI API token in the repository secret `PYPI_API_TOKEN`.

on:
  push:
    tags: ["py-v*"]

permissions:
  contents: read

jobs:
  version:
    name: Check the tag matches the version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/release_version.py --tag "$GITHUB_REF_NAME"

  dist:
    needs: version
    uses: ./.github/workflows/wheels.yml

  publish:
    name: Publish to PyPI
    needs: dist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # Attestations need trusted publishing, so they are off with a token.
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          attestations: false
