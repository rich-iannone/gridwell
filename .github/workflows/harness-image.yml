name: Harness image

# Builds and publishes the pinned renderer toolchain image to GHCR so it can be
# `docker pull`-ed for local golden-seeding (see harness/README.md). CI's visual
# job does NOT depend on this — it builds the image inline from the Dockerfile.
#
# Runs automatically when the Dockerfile changes on main, or on demand from ANY
# branch via "Run workflow" (workflow_dispatch), which is handy for publishing a
# branch's image before it merges. The dispatch form takes an optional tag so a
# branch build can be published under its own tag without clobbering the
# canonical `pinned-2026-07`.

on:
  push:
    branches: [main]
    paths:
      - "harness/Dockerfile"
      - ".github/workflows/harness-image.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish (e.g. pinned-2026-07, or a test tag)"
        required: true
        default: pinned-2026-07

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/gridwell-harness

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # workflow_dispatch supplies the tag; push events use the canonical one.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: harness/Dockerfile
          push: true
          tags: ${{ env.IMAGE }}:${{ github.event.inputs.tag || 'pinned-2026-07' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
