name: Wheels

# The Python wheels for every supported platform and the sdist, each installed and
# tested on the platform it is for. Nothing is published: the wheels and the sdist
# are the run's artifacts. Run it by hand (Actions → Wheels → Run workflow) or by
# pushing a `v*` tag; a pull request that changes the packaging runs it too.
#
# One abi3 wheel per platform covers CPython 3.10 and later (not the free-threaded
# builds, which can't load abi3 modules).

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/wheels.yml"
      - "pyproject.toml"

concurrency:
  group: wheels-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux wheels build in maturin-action's manylinux2014 (glibc 2.17)
          # containers; aarch64 is cross-compiled.
          - platform: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            manylinux: "2014"
            tag: manylinux_2_17_x86_64
          - platform: linux-aarch64
            os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            manylinux: "2014"
            tag: manylinux_2_17_aarch64
          # One wheel for Apple silicon and Intel Macs.
          - platform: macos-universal2
            os: macos-latest
            target: universal2-apple-darwin
            tag: universal2
          - platform: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            tag: win_amd64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --locked --out dist
      - name: Check the wheel's tags
        shell: bash
        run: |
          ls dist
          wheels=(dist/*.whl)
          test "${#wheels[@]}" -eq 1
          case "${wheels[0]}" in
            *-cp310-abi3-*${{ matrix.tag }}*) ;;
            *) echo "expected one cp310-abi3 ${{ matrix.tag }} wheel"; exit 1 ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.platform }}
          path: dist/*.whl
          retention-days: 14

  sdist:
    name: Build (sdist)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
          retention-days: 14

  test:
    name: Test (${{ matrix.runner.name }}, Python ${{ matrix.python.version }} ${{ matrix.python.variant }})
    needs: build
    runs-on: ${{ matrix.runner.os }}
    strategy:
      fail-fast: false
      matrix:
        runner:
          - { name: linux-x86_64, os: ubuntu-latest, wheel: linux-x86_64 }
          - { name: linux-aarch64, os: ubuntu-24.04-arm, wheel: linux-aarch64 }
          - { name: macos-arm64, os: macos-latest, wheel: macos-universal2 }
          - { name: macos-x86_64, os: macos-15-intel, wheel: macos-universal2 }
          - { name: windows-x86_64, os: windows-latest, wheel: windows-x86_64 }
        # The oldest Python the abi3 wheel supports bare, the newest with [gt].
        python:
          - { version: "3.10", variant: core }
          - { version: "3.14", variant: gt }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python.version }}
      - uses: actions/download-artifact@v4
        with:
          name: wheel-${{ matrix.runner.wheel }}
          path: dist
      - name: Install wheel
        shell: bash
        run: |
          python -m pip install --upgrade pip
          whl=$(ls dist/*.whl)
          if [ "${{ matrix.python.variant }}" = gt ]; then
            python -m pip install "${whl}[gt]" pytest mypy
          else
            python -m pip install "$whl" pytest mypy
            python -c "import importlib.util as u, sys; sys.exit(any(u.find_spec(m) for m in ('pandas', 'great_tables')))"
          fi
      - name: Check the universal2 wheel has both architectures
        if: matrix.runner.wheel == 'macos-universal2'
        working-directory: ${{ runner.temp }}
        run: |
          lib=$(python -c "import gridwell._native as n; print(n.__file__)")
          archs=$(lipo -archs "$lib")
          echo "$lib: $archs"
          case " $archs " in *" x86_64 "*" arm64 "*|*" arm64 "*" x86_64 "*) ;; *) exit 1 ;; esac
      # From outside the checkout, so `import gridwell` is the installed wheel.
      - name: Test installed wheel
        working-directory: ${{ runner.temp }}
        shell: bash
        env:
          GRIDWELL_REQUIRE_MYPY: "1"
        run: python -m pytest -p no:cacheprovider -rs "$GITHUB_WORKSPACE/tests"

  # The sdist must build on its own: install it from source and test it.
  sdist-test:
    name: Test (sdist, Python 3.13 gt)
    needs: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
      - name: Install from the sdist
        run: |
          python -m pip install --upgrade pip
          sdist=$(ls dist/*.tar.gz)
          python -m pip install --no-binary gridwell "${sdist}[gt]" pytest mypy
      - name: Test installed sdist
        working-directory: ${{ runner.temp }}
        env:
          GRIDWELL_REQUIRE_MYPY: "1"
        run: python -m pytest -p no:cacheprovider -rs "$GITHUB_WORKSPACE/tests"
