[workspace]
members = [
    "crates/gridwell-ir",
    "crates/gridwell-core",
    "crates/gridwell-testkit",
    "crates/gridwell-writer-html",
    "crates/gridwell-writer-latex",
    "crates/gridwell-writer-typst",
    "crates/gridwell-writer-rtf",
    "crates/gridwell-writer-svg",
    "crates/gridwell-writer-ansi",
    "crates/gridwell-writer-pandoc",
    "crates/gridwell-writer-quarto",
    "crates/gridwell-writer-docx",
    "crates/gridwell-writer-xlsx",
    "crates/gridwell-writer-pptx",
    "crates/gridwell-ffi",
    "crates/gridwell-python",
    "crates/gridwell-r",
    "crates/gridwell-cli",
    "xtask",
]
# The language-binding crates need external toolchains at build time
# (gridwell-r → R via libR-sys; gridwell-python → a Python interpreter via pyo3)
# and are built by maturin / R's own tooling, not by plain `cargo`. Excluding
# them from the default set keeps bare `cargo check|test|clippy` (locally and in
# CI) buildable without R/Python installed. Target them explicitly with
# `-p gridwell-r` / `-p gridwell-python` (or `--workspace`) when needed.
default-members = [
    "crates/gridwell-ir",
    "crates/gridwell-core",
    "crates/gridwell-testkit",
    "crates/gridwell-writer-html",
    "crates/gridwell-writer-latex",
    "crates/gridwell-writer-typst",
    "crates/gridwell-writer-rtf",
    "crates/gridwell-writer-svg",
    "crates/gridwell-writer-ansi",
    "crates/gridwell-writer-pandoc",
    "crates/gridwell-writer-quarto",
    "crates/gridwell-writer-docx",
    "crates/gridwell-writer-xlsx",
    "crates/gridwell-writer-pptx",
    "crates/gridwell-ffi",
    "crates/gridwell-cli",
    "xtask",
]
exclude = ["r-package/src/rust", "fuzz"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/rich-iannone/gridwell"
rust-version = "1.75"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
insta = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
quick-xml = { version = "0.37", features = ["serialize"] }
pyo3 = { version = "0.23", features = ["extension-module"] }
extendr-api = "0.7"
clap = { version = "4", features = ["derive"] }
