[workspace]
members = [
    "crates/gridwell",
    "crates/gridwell-ir",
    "crates/gridwell-core",
    "crates/gridwell-testkit",
    "crates/gridwell-layout",
    "crates/gridwell-ooxml",
    "crates/gridwell-render",
    "crates/gridwell-writer-html",
    "crates/gridwell-writer-latex",
    "crates/gridwell-writer-typst",
    "crates/gridwell-writer-rtf",
    "crates/gridwell-writer-svg",
    "crates/gridwell-writer-ansi",
    "crates/gridwell-writer-pandoc",
    "crates/gridwell-writer-quarto",
    "crates/gridwell-writer-docx",
    "crates/gridwell-writer-xlsx",
    "crates/gridwell-writer-pptx",
    "crates/gridwell-ffi",
    "crates/gridwell-python",
    "crates/gridwell-cli",
    "xtask",
]
# The Python binding needs a Python interpreter at build time (via pyo3) and is
# built by maturin, not by plain `cargo`. Excluding it from the default set keeps
# bare `cargo check|test|clippy` (locally and in CI) buildable without Python
# installed. Target it explicitly with `-p gridwell-python` (or `--workspace`).
# The R binding lives in r-package/src/rust (excluded below) and is built by R's
# own tooling.
default-members = [
    "crates/gridwell",
    "crates/gridwell-ir",
    "crates/gridwell-core",
    "crates/gridwell-testkit",
    "crates/gridwell-layout",
    "crates/gridwell-ooxml",
    "crates/gridwell-render",
    "crates/gridwell-writer-html",
    "crates/gridwell-writer-latex",
    "crates/gridwell-writer-typst",
    "crates/gridwell-writer-rtf",
    "crates/gridwell-writer-svg",
    "crates/gridwell-writer-ansi",
    "crates/gridwell-writer-pandoc",
    "crates/gridwell-writer-quarto",
    "crates/gridwell-writer-docx",
    "crates/gridwell-writer-xlsx",
    "crates/gridwell-writer-pptx",
    "crates/gridwell-ffi",
    "crates/gridwell-cli",
    "xtask",
]
exclude = ["r-package/src/rust", "fuzz"]
# Resolver 3: `cargo update` prefers dependency versions compatible with
# `rust-version`, so the MSRV can't be raised silently by an update.
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/rich-iannone/gridwell"
homepage = "https://rich-iannone.github.io/gridwell/"
keywords = ["table", "rendering", "html", "latex", "typst"]
categories = ["rendering", "text-processing"]
# Effective floor of the locked dependency tree (clap 4.6, indexmap 2.14 via zip);
# CI's `msrv` job enforces it. Raise deliberately, never by accident.
rust-version = "1.85"

[workspace.dependencies]
# The workspace crates, by path here and by version on crates.io (a path alone
# can't be published). They are released together, at the workspace version.
gridwell = { path = "crates/gridwell", version = "0.1.0" }
gridwell-ir = { path = "crates/gridwell-ir", version = "0.1.0" }
gridwell-core = { path = "crates/gridwell-core", version = "0.1.0" }
gridwell-layout = { path = "crates/gridwell-layout", version = "0.1.0" }
gridwell-ooxml = { path = "crates/gridwell-ooxml", version = "0.1.0" }
gridwell-render = { path = "crates/gridwell-render", version = "0.1.0" }
gridwell-writer-html = { path = "crates/gridwell-writer-html", version = "0.1.0" }
gridwell-writer-latex = { path = "crates/gridwell-writer-latex", version = "0.1.0" }
gridwell-writer-typst = { path = "crates/gridwell-writer-typst", version = "0.1.0" }
gridwell-writer-rtf = { path = "crates/gridwell-writer-rtf", version = "0.1.0" }
gridwell-writer-svg = { path = "crates/gridwell-writer-svg", version = "0.1.0" }
gridwell-writer-ansi = { path = "crates/gridwell-writer-ansi", version = "0.1.0" }
gridwell-writer-pandoc = { path = "crates/gridwell-writer-pandoc", version = "0.1.0" }
gridwell-writer-quarto = { path = "crates/gridwell-writer-quarto", version = "0.1.0" }
gridwell-writer-docx = { path = "crates/gridwell-writer-docx", version = "0.1.0" }
gridwell-writer-xlsx = { path = "crates/gridwell-writer-xlsx", version = "0.1.0" }
gridwell-writer-pptx = { path = "crates/gridwell-writer-pptx", version = "0.1.0" }
# Not published: a path alone, so cargo drops it from the packaged manifests of
# the crates that test with it.
gridwell-testkit = { path = "crates/gridwell-testkit" }

serde ={ version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
insta = "1"
# zip 7.2 is the last release on Rust 1.85 (7.4 needs 1.88); rust_xlsxwriter
# 0.96 is its last release on 1.85 and depends on zip 7.2, so the workspace
# shares one zip.
zip = { version = "7.2", default-features = false, features = ["deflate"] }
rust_xlsxwriter = { version = "0.96", default-features = false }
quick-xml = { version = "0.37", features = ["serialize"] }
pyo3 = { version = "0.23", features = ["extension-module"] }
extendr-api = "0.7"
clap = { version = "4", features = ["derive"] }

# Compression is hot in tests: every OOXML render deflates a zip, and unoptimized
# zlib-rs (miniz_oxide, before zip 7) makes the writer test suites several times slower in debug builds.
# Optimizing just these dependencies keeps `cargo test` fast without affecting how
# our own crates are compiled or debugged.
[profile.dev.package.miniz_oxide]
opt-level = 3

[profile.dev.package.flate2]
opt-level = 3

[profile.dev.package.crc32fast]
opt-level = 3

[profile.dev.package.zip]
opt-level = 3

[profile.dev.package.zlib-rs]
opt-level = 3

[profile.dev.package.rust_xlsxwriter]
opt-level = 3
