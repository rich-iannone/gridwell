[package]
name = "gridwell-python"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Python bindings for gridwell table rendering"

[lib]
name = "gridwell"
crate-type = ["cdylib"]

[dependencies]
gridwell-ir = { path = "../gridwell-ir" }
gridwell-render = { path = "../gridwell-render" }
# abi3: one wheel per platform covers every CPython >= 3.10 (requires-python).
pyo3 = { workspace = true, features = ["abi3-py310"] }
