[package]
name = "gridwell-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "C FFI surface for gridwell: parse IR, validate, render to all formats"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
gridwell-ir = { path = "../gridwell-ir" }
gridwell-render = { path = "../gridwell-render" }

[dev-dependencies]
serde_json = { workspace = true }
gridwell-testkit = { path = "../gridwell-testkit" }
cbindgen = "0.29.4"
