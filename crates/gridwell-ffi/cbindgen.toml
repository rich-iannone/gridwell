# cbindgen configuration for include/gridwell.h.
# Regenerate with:  GRIDWELL_BLESS=1 cargo test -p gridwell-ffi --test header
language = "C"
include_guard = "GRIDWELL_H"
cpp_compat = true
sys_includes = ["stddef.h", "stdint.h"]
no_includes = true
usize_is_size_t = true
documentation = true
documentation_style = "c99"
header = """
/*
 * gridwell C API.
 *
 * Generated by cbindgen from crates/gridwell-ffi/src/lib.rs. Do not edit by hand:
 * edit the Rust source and run
 *     GRIDWELL_BLESS=1 cargo test -p gridwell-ffi --test header
 */"""

[export]
include = ["GridwellTable", "GridwellError"]

[enum]
prefix_with_name = true
