[package]
name = "gridwell-r"
publish = false
version = "0.1.0"
edition = "2021"
rust-version = "1.85"

[lib]
crate-type = ["rlib", "staticlib"]
name = "gridwell"

[[bin]]
name = "document"
path = "document.rs"

[dependencies]
extendr-api = "*"
gridwell-ir = { path = "../../../crates/gridwell-ir" }
gridwell-render = { path = "../../../crates/gridwell-render" }

[profile.release]
lto = true
codegen-units = 1
